<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      :root { --ground:#0b1020; --panel:#141b31; --line:#2b3660; --ink:#f4f6fb; --muted:#9aa5c4;
        --blue:#5b8cff; --ok:#3ddc97; --accent:#ffd84d; --bad:#ff5a5f;
        --font:"Inter","Liberation Sans",sans-serif; --mono:"JetBrains Mono","DejaVu Sans Mono",monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1080px; overflow:hidden; background:var(--ground); font-family:var(--font); color:var(--ink); }
      #root { position:relative; width:100%; height:100%; }
      #card { position:absolute; left:90px; top:80px; width:900px; height:900px; background:var(--panel); border:4px solid var(--line); border-radius:36px; padding:44px 48px; opacity:0; }
      .hd { display:flex; justify-content:space-between; align-items:center; }
      .hd b { font:800 44px/1 var(--font); }
      .pill { font:800 26px/1 var(--mono); padding:10px 14px; border-radius:10px; background:var(--blue); color:var(--ground); }
      .row { margin-top:34px; padding-bottom:24px; border-bottom:2px solid var(--line); opacity:0; }
      .k { font:700 26px/1 var(--mono); color:var(--muted); letter-spacing:.08em; }
      .v { font:700 40px/1.25 var(--font); margin-top:10px; }
      #guard { margin-top:34px; display:inline-block; font:800 28px/1 var(--mono); padding:14px 18px; border-radius:12px; border:3px solid var(--bad); color:var(--bad); opacity:0; }
      #next { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); font:800 30px/1 var(--mono); padding:16px 22px; border-radius:12px; background:var(--ok); color:var(--ground); white-space:nowrap; opacity:0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="hd"><b>Weekend intake note</b><span class="pill">SAT 2:14 PM</span></div>
        <div class="row" id="r1"><div class="k">CALLER</div><div class="v">Carlos Demo · (555) 010-7720</div></div>
        <div class="row" id="r2"><div class="k">WHAT HAPPENED</div><div class="v">Car accident on Friday. Other driver ran a red light.</div></div>
        <div class="row" id="r3"><div class="k">BEST TIME TO CALL</div><div class="v">Monday morning</div></div>
        <div id="guard">✕ NO LEGAL ADVICE GIVEN</div>
      </div>
      <div id="next" class="clip" data-start="0" data-duration="8" data-track-index="1">MONDAY → INTAKE TEAM → ATTORNEY</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#r1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 0.7);
      tl.fromTo("#r2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 1.4);
      tl.fromTo("#r3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 2.1);
      tl.fromTo("#guard", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 2.8);
      tl.fromTo("#next", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 3.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
