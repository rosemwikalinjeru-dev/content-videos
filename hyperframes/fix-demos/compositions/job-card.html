<!doctype html>
<html lang="en" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      :root { --ground:#0b1020; --screen:#f5f6fa; --ink:#12151f; --muted:#5d6478; --line:#e2e5ee;
        --blue:#2f6fed; --ok:#1f9d6b; --accent:#ffd84d;
        --font:"Inter","Liberation Sans",sans-serif; --mono:"JetBrains Mono","DejaVu Sans Mono",monospace; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1080px; overflow:hidden; background:var(--ground); font-family:var(--font); }
      #root { position:relative; width:100%; height:100%; }
      #phone { position:absolute; left:200px; top:30px; width:680px; height:1000px; background:#05070f; border-radius:72px; padding:22px; opacity:0; }
      .screen { width:100%; height:100%; background:var(--screen); border-radius:54px; overflow:hidden; position:relative; }
      .head { padding:34px 40px 20px; border-bottom:2px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
      .head .n { font:800 40px/1.1 var(--font); color:var(--ink); }
      .pill { font:800 24px/1 var(--mono); padding:10px 14px; border-radius:10px; background:var(--line); color:var(--muted); }
      .row { margin:0 34px; padding:22px 6px; border-bottom:2px solid var(--line); opacity:0; }
      .k { font:700 24px/1 var(--mono); color:var(--muted); letter-spacing:.06em; }
      .v { font:700 34px/1.25 var(--font); color:var(--ink); margin-top:8px; }
      .thumbs { display:flex; gap:16px; margin-top:12px; }
      .thumb { width:150px; height:110px; border-radius:14px; background:linear-gradient(135deg,#c9cfdd,#9aa3b8); }
      #ok { position:absolute; left:34px; right:34px; bottom:30px; height:96px; border-radius:20px; background:var(--ok); color:#fff;
        font:800 28px/96px var(--font); text-align:center; opacity:0; white-space:nowrap; }
      #tag { position:absolute; left:50%; top:24px; transform:translateX(-50%); background:var(--accent); color:var(--ground);
        font:800 28px/1 var(--mono); letter-spacing:.08em; padding:12px 18px; border-radius:10px; opacity:0; white-space:nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1080">
      <div id="phone" class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="screen">
          <div class="head"><div class="n">Job #1042</div><div class="pill" id="pill">NEW BOOKING</div></div>
          <div class="row" id="r1"><div class="k">CUSTOMER</div><div class="v">Priya Demo · (555) 010-3388</div></div>
          <div class="row" id="r2"><div class="k">ADDRESS</div><div class="v">12 Demo Street</div></div>
          <div class="row" id="r3"><div class="k">GATE CODE</div><div class="v">#4471</div></div>
          <div class="row" id="r4"><div class="k">ISSUE + PHOTOS</div><div class="v">Water heater leaking</div><div class="thumbs"><div class="thumb"></div><div class="thumb"></div></div></div>
          <div id="ok">✓ Office checked · sent to plumber</div>
        </div>
      </div>
      <div id="tag" class="clip" data-start="0" data-duration="8" data-track-index="1">DEMO · ONE CARD, EVERYTHING ON IT</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#phone", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
      tl.fromTo("#r1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 0.8);
      tl.fromTo("#r2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 1.4);
      tl.fromTo("#r3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 2.0);
      tl.fromTo("#r4", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3 }, 2.6);
      tl.fromTo("#ok", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 3.6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
