<!doctype html>
<html
  lang="en"
  data-resolution="square"
  data-composition-variables='[
    {"id":"clock","type":"string","label":"Status-bar time","default":"8:00"},
    {"id":"app","type":"string","label":"App title","default":"Inbox"},
    {"id":"badge","type":"string","label":"Header badge","default":"14 new"},
    {"id":"items","type":"string","label":"Rows as JSON [{t,s,tag,bad}]","default":"[{\"t\":\"New patient enquiry\",\"s\":\"Sarah Demo · 7:52 AM\",\"tag\":\"Unread\"}]"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <!-- One reusable "owner's moment" phone screen. Each video renders it with --variables. -->
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1020;
        --phone: #05070f;
        --screen: #f5f6fa;
        --ink: #12151f;
        --muted: #5d6478;
        --line: #e2e5ee;
        --bad: #e5484d;
        --accent: #ffd84d;
        --font: "Inter", "Liberation Sans", sans-serif;
        --mono: "JetBrains Mono", "DejaVu Sans Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--ground); font-family: var(--font); }
      #root { position: relative; width: 100%; height: 100%; }

      #phone {
        position: absolute; left: 200px; top: 40px; width: 680px; height: 1000px;
        background: var(--phone); border-radius: 72px; padding: 22px; opacity: 0;
        box-shadow: 0 40px 100px rgba(0,0,0,.6);
      }
      .screen { width: 100%; height: 100%; background: var(--screen); border-radius: 54px; overflow: hidden; position: relative; }
      .status { height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 44px;
        font: 700 30px/1 var(--font); color: var(--ink); }
      .appbar { padding: 14px 40px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--line); }
      .appbar h1 { font: 800 44px/1.1 var(--font); color: var(--ink); letter-spacing: -0.02em; }
      .badge { font: 800 28px/1 var(--font); color: #fff; background: var(--bad); padding: 10px 16px; border-radius: 999px; }
      .row { margin: 0 24px; padding: 24px 18px; border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 18px; opacity: 0; }
      .dot { width: 18px; height: 18px; border-radius: 50%; background: #2f6fed; flex-shrink: 0; }
      .row.bad .dot { background: var(--bad); }
      .txt { flex: 1; min-width: 0; }
      .t { font: 700 32px/1.2 var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .s { font: 500 28px/1.3 var(--font); color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag { font: 700 26px/1 var(--font); color: var(--muted); border: 2px solid var(--line); padding: 8px 12px; border-radius: 10px; flex-shrink: 0; }
      .row.bad .tag { color: var(--bad); border-color: var(--bad); }

      #demo { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
        font: 700 28px/1 var(--mono); letter-spacing: .12em; color: var(--ground); background: var(--accent);
        padding: 10px 18px; border-radius: 8px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1080">
      <div id="phone" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="screen">
          <div class="status"><span id="clock">8:00</span><span>●●● 5G</span></div>
          <div class="appbar"><h1 id="app">Inbox</h1><span class="badge" id="badge">14 new</span></div>
          <div id="rows"></div>
        </div>
      </div>
      <div id="demo" class="clip" data-start="0" data-duration="6" data-track-index="1">DEMO SCENARIO</div>
    </div>

    <script>
      const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      document.getElementById("clock").textContent = v.clock || "8:00";
      document.getElementById("app").textContent = v.app || "Inbox";
      const badge = document.getElementById("badge");
      if (v.badge) badge.textContent = v.badge; else badge.style.display = "none";

      let items = [];
      try { items = JSON.parse(v.items || "[]"); } catch (e) { items = []; }
      const rowsEl = document.getElementById("rows");
      items.slice(0, 6).forEach((it, i) => {
        const row = document.createElement("div");
        row.className = "row" + (it.bad ? " bad" : "");
        row.id = "row" + i;
        row.innerHTML =
          '<span class="dot"></span><div class="txt"><div class="t"></div><div class="s"></div></div>' +
          (it.tag ? '<span class="tag"></span>' : "");
        row.querySelector(".t").textContent = it.t || "";
        row.querySelector(".s").textContent = it.s || "";
        if (it.tag) row.querySelector(".tag").textContent = it.tag;
        rowsEl.appendChild(row);
      });

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#phone", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      const rows = Array.from(rowsEl.children);
      rows.forEach((r, i) => {
        tl.fromTo(r, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 0.45 + i * 0.32);
      });
      tl.fromTo("#demo", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.3);
      // the last "bad" row pulses once so the eye lands on the problem
      const bad = rows.filter((r) => r.classList.contains("bad"));
      if (bad.length) {
        const last = bad[bad.length - 1];
        const at = 0.45 + rows.length * 0.32 + 0.2;
        tl.to(last, { scale: 1.04, duration: 0.2, ease: "power2.out" }, at);
        tl.to(last, { scale: 1, duration: 0.25, ease: "power2.in" }, at + 0.2);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
